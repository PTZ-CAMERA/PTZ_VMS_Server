# M1: one camera per process. Relative path is resolved from working directory.
camera_id=CAM01
# Optional direct-ingest fallback. Leave empty for ONVIF registration from Qt.
rtsp_url=
rtsp_transport=tcp
connect_timeout_ms=5000
read_timeout_ms=5000
reconnect_delay_ms=2000
stats_interval_ms=5000

# WebSocket control/status API
client_bind=127.0.0.1
client_port=5000

# VMS-managed RTSP/TCP. This host must refer to the VMS PC, never the camera.
rtsp_relay_bind=127.0.0.1
rtsp_relay_port=8555
rtsp_public_host=127.0.0.1
# VMS 내부 WebRTC. 신호 교환은 기존 /ws, 미디어는 ICE UDP 포트를 사용한다.
webrtc_enabled=true
webrtc_port_begin=50000
webrtc_port_end=50100

# ONVIF credentials belong in an ignored local config or Qt registration form.
onvif_url=http://192.168.0.92:8080/onvif/device_service

# Relative storage paths are resolved against the configuration file directory.
recording_root=../recordings
recording_database=../data/vms.db
recording_container=mkv
recording_segment_seconds=600
# 사람 탐지 이벤트로 녹화 시작. Pi 탐지 활성화 및 Events 수신이 필요하다.
auto_recording_enabled=false
auto_recording_post_seconds=10

# ONVIF Events: 실물 시험 때 true로 켠다. 기본 실행은 자동 Pi 이벤트 시험을 하지 않는다.
events_enabled=false
events_pull_seconds=5
events_message_limit=32
events_retry_ms=2000
metadata_sample_ms=1000
metadata_retention_days=7
event_retention_days=30
# Pi 소스의 필드 매핑이 기본 내장되어 있다. 다른 장치/버전에서 필요한 항목만 덮어쓴다.
events_field_map={}

# Gemini는 질문의 검색 조건만 해석한다. 키는 환경변수 또는 Git 제외 파일에서 읽는다.
chat_enabled=false
chat_model=gemini-3.5-flash-lite
chat_api_key_file=gemini-key.local.conf
chat_timeout_ms=15000
